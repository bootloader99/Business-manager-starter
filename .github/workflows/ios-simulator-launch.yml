name: iOS Simulator Launch

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful run ID from iOS Simulator Build"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ios-simulator-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    name: Install and launch BusinessManager
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode and verify simulator tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_26.3.app/Contents/Developer" ]]; then
            sudo xcode-select --switch "/Applications/Xcode_26.3.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list devices available

      - name: Download app from the specified build run
        uses: actions/download-artifact@v4
        with:
          name: business-manager-ios-simulator-app
          path: ${{ runner.temp }}/downloaded-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify app bundle and read bundle identifier
        id: app
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/downloaded-app/BusinessManager.app.zip"
          if [[ ! -f "$ZIP_PATH" ]]; then
            echo "::error::Expected BusinessManager.app.zip was not found in the selected build artifact."
            find "$RUNNER_TEMP/downloaded-app" -maxdepth 3 -print
            exit 1
          fi
          ditto -x -k "$ZIP_PATH" "$RUNNER_TEMP/downloaded-app"
          APP_PATH="$RUNNER_TEMP/downloaded-app/BusinessManager.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Expected BusinessManager.app was not found in the selected build artifact."
            find "$RUNNER_TEMP/downloaded-app" -maxdepth 3 -print
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ -z "$BUNDLE_ID" ]]; then
            echo "::error::The built app does not contain a bundle identifier."
            exit 1
          fi
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Built app bundle identifier: $BUNDLE_ID"

      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_JSON="$RUNNER_TEMP/simulator-devices.json"
          xcrun simctl list devices available --json > "$DEVICE_JSON"
          UDID=$(python3 - "$DEVICE_JSON" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          for runtime, devices in data.get("devices", {}).items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found.")
          PY
          )
          if [[ -z "$UDID" ]]; then
            echo "::error::No available iPhone simulator was found."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || {
            xcrun simctl list devices available
            exit 1
          }
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch the existing build
        shell: bash
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" "$BUNDLE_ID"
          sleep 15
          xcrun simctl list devices | tee "$RUNNER_TEMP/simulator-state.txt"
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/ios-simulator-screenshot.png"
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 5m --style compact \
            --predicate 'process == "BusinessManager" OR eventMessage CONTAINS[c] "BusinessManager"' \
            > "$RUNNER_TEMP/ios-simulator-app.log" 2>&1 || true

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-evidence
          path: |
            ${{ runner.temp }}/ios-simulator-screenshot.png
            ${{ runner.temp }}/ios-simulator-app.log
            ${{ runner.temp }}/simulator-state.txt
          if-no-files-found: warn
          retention-days: 5
