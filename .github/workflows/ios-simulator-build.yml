name: iOS Simulator Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build BusinessManager for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "/Applications/Xcode_26.3.app/Contents/Developer" ]]; then
            sudo xcode-select --switch "/Applications/Xcode_26.3.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun simctl list devices available

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Initialize diagnostic log
        shell: bash
        run: |
          printf 'iOS Simulator build diagnostics\\nCommit: %s\\nRunner: %s\\n' "$GITHUB_SHA" "$RUNNER_OS" > "$RUNNER_TEMP/ios-build.log"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a "$RUNNER_TEMP/ios-build.log"

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          bundle install 2>&1 | tee -a "$RUNNER_TEMP/ios-build.log"
          cd ios
          bundle exec pod install 2>&1 | tee -a "$RUNNER_TEMP/ios-build.log"

      - name: Build iOS Simulator app
        id: build
        shell: bash
        run: |
          set -o pipefail
          DERIVED_DATA="$RUNNER_TEMP/BusinessManagerDerivedData"
          LOG_FILE="$RUNNER_TEMP/ios-build.log"
          xcodebuild \
            -workspace ios/BusinessManager.xcworkspace \
            -scheme BusinessManager \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee -a "$LOG_FILE"

      - name: Verify embedded JavaScript and icon font assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/BusinessManagerDerivedData/Build/Products/Release-iphonesimulator/BusinessManager.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/main.jsbundle"
          test -f "$APP_PATH/MaterialDesignIcons.ttf"
          /usr/libexec/PlistBuddy -c 'Print :UIAppFonts' "$APP_PATH/Info.plist" | grep -F 'MaterialDesignIcons.ttf'
          echo "Verified embedded JavaScript bundle and Material Design icon font."

      - name: Prepare app artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/BusinessManagerDerivedData/Build/Products/Release-iphonesimulator/BusinessManager.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/BusinessManager.app.zip"

      - name: Upload compiled simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: business-manager-ios-simulator-app
          path: ${{ runner.temp }}/BusinessManager.app.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: warn
          retention-days: 5
